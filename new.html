        function Reveal({ children, delay = 0, className = "" }) {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target); 
                        }
                    },
                    { threshold: 0.1, rootMargin: "0px 0px -50px 0px" }
                );
                
                if (ref.current) {
                    observer.observe(ref.current);
                }
                
                return () => observer.disconnect();
            }, []);

            return (
                <div
                    ref={ref}
                    className={`reveal-hidden ${isVisible ? 'reveal-visible' : ''} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        }

        function AnimatedSkillBar({ name, level, delay }) {
            const [width, setWidth] = useState("0%");
            const ref = useRef(null);

                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setTimeout(() => {
                                setWidth(level);
                            }, delay);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold: 0.1 }
                );

                    observer.observe(ref.current);
                }

                return () => observer.disconnect();
            }, [level, delay]);

                            style={{ width: width }}
                        ></div>
                    </div>
                </div>
            );
        }

        function Typewriter({ words, speed = 100, eraseSpeed = 50, delay = 2000 }) {
            const [text, setText] = useState("");
            const [isDeleting, setIsDeleting] = useState(false);
            const [loop, setLoop] = useState(0);
            const [typingSpeed, setTypingSpeed] = useState(speed);

            useEffect(() => {
                const handleTyping = () => {
                    const currentWordIndex = loop % words.length;
                    const fullWord = words[currentWordIndex];

                    if (!isDeleting) {
                        setText(fullWord.substring(0, text.length + 1));
                        setTypingSpeed(speed);

                        if (text === fullWord) {
                            setTypingSpeed(delay);
                            setIsDeleting(true);
                        }
                    } else {
                        setText(fullWord.substring(0, text.length - 1));
                        setTypingSpeed(eraseSpeed);

                        if (text === "") {
                            setIsDeleting(false);
                            setLoop(loop + 1);
                            setTypingSpeed(speed);
                        }
                    }
                };

                const timer = setTimeout(handleTyping, typingSpeed);
                return () => clearTimeout(timer);
            }, [text, isDeleting, loop, words, speed, eraseSpeed, delay, typingSpeed]);

            return (
                <span className="cursor-blink text-emerald-400 pr-1">{text}</span>
            );
        }
