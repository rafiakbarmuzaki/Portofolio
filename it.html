function isUrlConfigured(url) {
  return typeof url === "string" && url.startsWith("http");
}

function fetchSheet(url) {
  return new Promise((resolve, reject) => {
    if (!isUrlConfigured(url)) {
      reject(new Error("URL sheet belum diisi"));
      return;
    }
    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (results) => resolve(results.data),
      error: (err) => reject(err),
    });
  });
}

function useSheetData() {

  useEffect(() => {

      let fellBack = false;

      // --- projects ---
      let projects = FALLBACK_DATA.projects;
      try {
        const rows = await fetchSheet(SHEET_URLS.projects);
        if (rows && rows.length) {
          projects = rows.map((r, idx) => ({
            id: idx + 1,
            title: r.title || "",
            description: r.description || "",
            category: r.category || "",
            tags: r.tags ? r.tags.split(",").map(t => t.trim()).filter(Boolean) : [],
            image: r.image || "",
            demoLink: r.demoLink || "#",
            codeLink: r.codeLink || "#",
          }));
        } else { fellBack = true; }
      } catch (e) { fellBack = true; }

      // --- skills ---
      let skills = FALLBACK_DATA.skills;
      try {
        const rows = await fetchSheet(SHEET_URLS.skills);
        if (rows && rows.length) {
          const grouped = { frontend: [], backend: [], tools: [], database: [] };
          rows.forEach(r => {
            const g = (r.group || "").toLowerCase().trim();
            if (grouped[g]) {
              grouped[g].push({ name: r.name || "", level: r.level || "0%" });
            }
          });
          if (grouped.frontend.length || grouped.backend.length || grouped.tools.length || grouped.database.length) {
            skills = grouped;
          } else { fellBack = true; }
        } else { fellBack = true; }
      } catch (e) { fellBack = true; }

      // --- experience ---
      let experience = FALLBACK_DATA.experience;
      try {
        const rows = await fetchSheet(SHEET_URLS.experience);
        if (rows && rows.length) {
          experience = rows.map(r => ({
            year: r.year || "",
            role: r.role || "",
            company: r.company || "",
            desc: r.desc || "",
          }));
        } else { fellBack = true; }
      } catch (e) { fellBack = true; }

      setData({ projects, skills, experience });
      setUsedFallback(fellBack);
      setLoading(false);
    }

    loadAll();
  }, []);

  return { data, loading, usedFallback };
}

function Reveal({ children, delay = 0, className = "" }) {
  const [isVisible, setIsVisible] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const observer = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setIsVisible(true); observer.unobserve(entry.target); } },
      { threshold: 0.1, rootMargin: "0px 0px -50px 0px" }
    );
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, []);
  return (
    <div ref={ref} className={`reveal-hidden ${isVisible ? 'reveal-visible' : ''} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </div>
  );
}

function AnimatedSkillBar({ name, level, delay }) {
  const [width, setWidth] = useState("0%");
  const ref = useRef(null);
  useEffect(() => {
    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setTimeout(() => setWidth(level), delay);
          observer.unobserve(entry.target);
        }
      },
      { threshold: 0.1 }
    );
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, [level, delay]);
  return (
    <div ref={ref} className="group/skill">
      <div className="flex justify-between text-sm font-medium text-slate-300 mb-1.5 transition duration-300 group-hover/skill:text-emerald-400">

      </div>
    </div>
  );
}

function Typewriter({ words, speed = 100, eraseSpeed = 50, delay = 2000 }) {
  const [text, setText] = useState("");
  const [isDeleting, setIsDeleting] = useState(false);
  const [loop, setLoop] = useState(0);
  const [typingSpeed, setTypingSpeed] = useState(speed);

  useEffect(() => {
    if (!words || words.length === 0) return;
    const handleTyping = () => {
      const currentWordIndex = loop % words.length;
      const fullWord = words[currentWordIndex];
      if (!isDeleting) {
        setText(fullWord.substring(0, text.length + 1));
        setTypingSpeed(speed);
        if (text === fullWord) { setTypingSpeed(delay); setIsDeleting(true); }
      } else {
        setText(fullWord.substring(0, text.length - 1));
        setTypingSpeed(eraseSpeed);
        if (text === "") { setIsDeleting(false); setLoop(loop + 1); setTypingSpeed(speed); }
      }
    };
    const timer = setTimeout(handleTyping, typingSpeed);
    return () => clearTimeout(timer);
  }, [text, isDeleting, loop, words, speed, eraseSpeed, delay, typingSpeed]);

  return <span className="cursor-blink text-emerald-400 pr-1">{text}</span>;
}
